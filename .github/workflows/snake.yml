name: Gothic serpent

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 1:00 a.m. Colombia time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summon the serpent
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-gothic.svg?color_snake=#9E2A2B&color_dots=#1A1614,#3A332C,#6B5E4E,#9C8459,#B8995A

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
