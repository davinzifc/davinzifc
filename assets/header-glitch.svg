<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="David Casañas — Full Stack Developer // Backend Specialist">
  <title>David Casañas — Full Stack Developer // Backend Specialist</title>
  <defs>
    <style>
      .name { font: 900 88px 'Arial Black', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1px; }
      .mono { font: 500 22px 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .small { font: 500 15px 'JetBrains Mono', Consolas, 'Courier New', monospace; letter-spacing: 1px; }
      .g1 { opacity: 0; animation: g1 3.2s infinite steps(1); }
      .g2 { opacity: 0; animation: g2 3.2s infinite steps(1); }
      .shake { animation: shake 3.2s infinite steps(1); }
      .blink { animation: blink 1s infinite steps(1); }
      .bar1 { animation: bar1 4s infinite steps(1); }
      .bar2 { animation: bar2 4s infinite steps(1); }
      @keyframes g1 {
        0%, 100% { opacity: 0; transform: translate(0, 0); }
        6% { opacity: 1; transform: translate(9px, 0); }
        9% { opacity: 1; transform: translate(-5px, 0); }
        12% { opacity: 0; transform: translate(0, 0); }
        58% { opacity: 1; transform: translate(12px, 0); }
        61% { opacity: 0; transform: translate(0, 0); }
      }
      @keyframes g2 {
        0%, 100% { opacity: 0; transform: translate(0, 0); }
        7% { opacity: 1; transform: translate(-8px, 0); }
        11% { opacity: 1; transform: translate(6px, 0); }
        14% { opacity: 0; transform: translate(0, 0); }
        59% { opacity: 1; transform: translate(-11px, 0); }
        62% { opacity: 0; transform: translate(0, 0); }
      }
      @keyframes shake {
        0%, 100% { transform: translate(0, 0); }
        6% { transform: translate(2px, 0); }
        9% { transform: translate(-2px, 0); }
        12% { transform: translate(0, 0); }
      }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes bar1 {
        0%, 100% { transform: translate(0, 0); }
        30% { transform: translate(-40px, 0); }
        70% { transform: translate(20px, 0); }
      }
      @keyframes bar2 {
        0%, 100% { transform: translate(0, 0); }
        40% { transform: translate(30px, 0); }
        80% { transform: translate(-25px, 0); }
      }
    </style>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
    <clipPath id="slice1"><rect x="0" y="112" width="1200" height="20"/></clipPath>
    <clipPath id="slice2"><rect x="0" y="150" width="1200" height="14"/></clipPath>
  </defs>

  <rect width="1200" height="300" fill="#0B0D10"/>

  <!-- glitch bars -->
  <g class="bar1"><rect x="1010" y="34" width="190" height="7" fill="#2EE6D6"/></g>
  <g class="bar2"><rect x="1060" y="47" width="80" height="7" fill="#FF3D8B"/></g>
  <rect x="0" y="120" width="7" height="90" fill="#2EE6D6"/>
  <rect x="0" y="214" width="7" height="30" fill="#FF3D8B"/>
  <g class="bar2"><rect x="880" y="268" width="220" height="5" fill="#FF3D8B"/></g>
  <g class="bar1"><rect x="960" y="278" width="90" height="5" fill="#2EE6D6"/></g>

  <!-- prompt -->
  <text x="60" y="76" class="mono" fill="#2EE6D6">&gt; whoami<tspan class="blink">_</tspan></text>

  <!-- name with RGB split -->
  <g class="shake">
    <text x="57" y="172" class="name" fill="#2EE6D6" opacity="0.9">DAVID CASAÑAS</text>
    <text x="63" y="172" class="name" fill="#FF3D8B" opacity="0.9">DAVID CASAÑAS</text>
    <text x="60" y="172" class="name" fill="#E8ECEF">DAVID CASAÑAS</text>
  </g>
  <g clip-path="url(#slice1)">
    <g class="g1"><text x="60" y="172" class="name" fill="#2EE6D6">DAVID CASAÑAS</text></g>
  </g>
  <g clip-path="url(#slice2)">
    <g class="g2"><text x="60" y="172" class="name" fill="#FF3D8B">DAVID CASAÑAS</text></g>
  </g>

  <!-- role -->
  <text x="60" y="222" class="mono" fill="#E8ECEF">Full Stack Developer <tspan fill="#FF3D8B">//</tspan> Backend Specialist</text>
  <text x="60" y="256" class="small" fill="#9AA4AB">NODE.JS · NESTJS · TYPESCRIPT · SPEC-DRIVEN AI DEV · CALI, CO</text>

  <!-- pixel block -->
  <g transform="translate(1056 150)">
    <rect x="0" y="0" width="16" height="16" fill="#2EE6D6"/>
    <rect x="40" y="0" width="16" height="16" fill="#E8ECEF"/>
    <rect x="60" y="0" width="16" height="16" fill="#FF3D8B"/>
    <rect x="20" y="20" width="16" height="16" fill="#FF3D8B"/>
    <rect x="60" y="20" width="16" height="16" fill="#2EE6D6"/>
    <rect x="80" y="20" width="16" height="16" fill="#E8ECEF"/>
    <rect x="0" y="40" width="16" height="16" fill="#E8ECEF"/>
    <rect x="40" y="40" width="16" height="16" fill="#2EE6D6"/>
    <rect x="80" y="40" width="16" height="16" fill="#FF3D8B"/>
  </g>

  <!-- scanlines on top -->
  <rect width="1200" height="300" fill="url(#scan)"/>
</svg>
